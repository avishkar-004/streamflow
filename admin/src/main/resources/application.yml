server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: streamflow-admin

# StreamFlow broker connection
streamflow:
  broker:
    host: localhost
    port: 9092
    connection-timeout: 5000
    request-timeout: 10000

# Management endpoints for Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.streamflow: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
