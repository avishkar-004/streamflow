version: '3.8'

services:
  # StreamFlow Broker
  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    container_name: streamflow-broker
    ports:
      - "9092:9092"
    environment:
      - BROKER_ID=0
      - HOST=0.0.0.0
      - PORT=9092
      - DATA_DIR=/app/data
    volumes:
      - broker-data:/app/data
    networks:
      - streamflow-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # StreamFlow Admin API
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: streamflow-admin
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - BROKER_HOST=broker
      - BROKER_PORT=9092
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - streamflow-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: streamflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - streamflow-network
    depends_on:
      - admin

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: streamflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - streamflow-network
    depends_on:
      - prometheus

volumes:
  broker-data:
  prometheus-data:
  grafana-data:

networks:
  streamflow-network:
    driver: bridge
