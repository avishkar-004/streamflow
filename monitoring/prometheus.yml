# Prometheus configuration for StreamFlow
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape StreamFlow Admin API metrics
  - job_name: 'streamflow-admin'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['admin:8080']
        labels:
          application: 'streamflow-admin'
          environment: 'docker'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
